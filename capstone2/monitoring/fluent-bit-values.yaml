# DaemonSet: one Fluent Bit per node tails /var/log/containers/*.log, adds Kubernetes metadata,
# derives a "level" label, and ships to Loki.
luaScripts:
  level.lua: |
    function add_level(tag, timestamp, record)
      local msg = record["log"] or record["message"] or ""
      local lower = string.lower(msg)
      local level = "info"
      if string.find(lower, "error") or string.find(lower, "exception") or string.find(lower, "fatal") or string.find(lower, "traceback") then
        level = "error"
      elseif string.find(lower, "warn") then
        level = "warn"
      end
      record["level"] = level
      return 1, timestamp, record
    end

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 1
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On

  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        multiline.parser docker, cri
        Tag kube.*
        Mem_Buf_Limit 10MB
        Skip_Long_Lines On

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log On
        K8S-Logging.Parser On
        K8S-Logging.Exclude On

    [FILTER]
        Name lua
        Match kube.*
        script /fluent-bit/scripts/level.lua
        call add_level

  outputs: |
    [OUTPUT]
        Name loki
        Match kube.*
        Host loki-gateway.monitoring.svc.cluster.local
        Port 80
        Labels job=fluent-bit, namespace=$kubernetes['namespace_name'], service=$kubernetes['container_name'], pod=$kubernetes['pod_name'], level=$level
        Remove_keys kubernetes,stream,time,_p
        Line_Format json
