apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: robot-shop-web
  namespace: monitoring
spec:
  interval: 15s
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://web.robot-shop.svc.cluster.local:8080/
      labels:
        app: robot-shop
        service: web
