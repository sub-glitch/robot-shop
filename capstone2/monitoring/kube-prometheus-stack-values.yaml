# Control-plane components are managed by AWS on EKS and cannot be scraped; disabling stops false alerts.
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeProxy: false

grafana:
  admin:
    existingSecret: grafana-admin           # created by scripts/install-observability.sh
    userKey: admin-user
    passwordKey: admin-password
  persistence: { enabled: true, size: 2Gi }
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
    - name: Jaeger
      type: jaeger
      uid: jaeger
      access: proxy
      url: http://jaeger.monitoring.svc.cluster.local:16686

prometheus:
  prometheusSpec:
    retention: 5d
    retentionSize: 15GB
    scrapeInterval: 15s
    # Pick up ServiceMonitors / PodMonitors / Probes / PrometheusRules from ANY namespace without label matching
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 200m, memory: 1Gi }
      limits: { memory: 2Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources: { requests: { storage: 20Gi } }
    # Scrape Robot Shop app metrics (/metrics on port 8080) without needing ServiceMonitors
    additionalScrapeConfigs:
      - job_name: robot-shop
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces: { names: [robot-shop] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: (cart|catalogue|payment|user)
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_number]
            regex: "8080"
            action: keep
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

alertmanager:
  alertmanagerSpec:
    # Mounts the Secret at /etc/alertmanager/secrets/alertmanager-slack/  (webhook URL never touches Git)
    secrets: [alertmanager-slack]
    resources:
      requests: { cpu: 25m, memory: 64Mi }
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: [alertname, service]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 2h
      routes:
        - receiver: slack
          matchers:
            - severity = "page"
    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook_url
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: |-
              {{ range .Alerts }}*{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              Runbook: {{ .Annotations.runbook_url }}
              {{ end }}
